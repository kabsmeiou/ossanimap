services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  worker:
    build: .
    command: rq worker -u redis://redis:6379 pack_queue
    environment:
      - OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis